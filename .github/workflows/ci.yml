name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install V
        run: |
          curl -fsSL -o /tmp/v_linux.zip https://github.com/vlang/v/releases/download/0.5.2/v_linux.zip
          unzip -q /tmp/v_linux.zip -d /tmp
          echo /tmp/v >> "$GITHUB_PATH"
          /tmp/v/v version
          mkdir -p ~/.vmodules
          ln -sfn "$GITHUB_WORKSPACE" ~/.vmodules/viltrum

      - name: Unit tests
        run: |
          v test http/
          v test router/
          v test engine/
          v test ws/

      - name: Build examples
        run: |
          v -o /tmp/viltrum-hello examples/hello
          v -o /tmp/viltrum-rest examples/rest
          v -o /tmp/viltrum-features examples/features
          v -o /tmp/viltrum-upgrade examples/upgrade_echo
          v -o /tmp/viltrum-ws-echo examples/ws_echo
          v -o /tmp/viltrum-https-hello examples/https_hello
          v -o /tmp/viltrum-wss-echo examples/wss_echo
          v -o /tmp/viltrum-upload examples/upload
          v -o /tmp/viltrum-client examples/client

      - name: Build WS load client
        run: v -o /tmp/viltrum-ws-load benches/ws_load_client.v

      - name: WS soak / close-storm (short)
        run: |
          CLIENTS=8 MSGS=50 CLOSE_ROUNDS=50 bash benches/soak_ws.sh
