name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

# One release at a time, in merge order. Merges that land while a release runs wait
# here instead of racing it: two runs would both version the same commits, and the
# loser finds main moved under it and publishes nothing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    # Independent of unit CI; only needs full git history + GITHUB_TOKEN.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # main as it is now, not the pushed commit: a queued run must see the
          # release commit the run before it pushed, or its own push is rejected
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Default GITHUB_TOKEN can push release commits when contents:write is set.
        run: npx semantic-release
