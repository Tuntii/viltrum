[package]
name = "viltrum-bench-axum"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
