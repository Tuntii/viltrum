# gateway-64: stock nginx (proxy/) terminates TLS and HTTP/2 on 8443 and
# forwards dynamic routes to viltrum on PROXY_PORT. The server is not given
# /certs, and with PROXY_PORT set it does not open 8443. It also opens 8080
# when that port is free, which is where the benchmark's readiness probe looks.
# PROXY_CPUSET and SERVER_CPUSET move the CPU split.
services:
  proxy:
    build: ./proxy
    network_mode: host
    cpuset: "${PROXY_CPUSET:-0-15,64-79}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    volumes:
      - ${CERTS_DIR}:/certs:ro
      - ${DATA_DIR}/static:/data/static:ro
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    cpuset: "${SERVER_CPUSET:-16-31,80-95}"
    ulimits:
      memlock: -1
      nofile:
        soft: 1048576
        hard: 1048576
    security_opt:
      - seccomp:unconfined
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_MAX_CONN=256
      - PROXY_PORT=8085
      - H1_PROBE_PORT=8080
    volumes:
      - ${DATA_DIR}/dataset.json:/data/dataset.json:ro
