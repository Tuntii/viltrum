# gateway-64: stock nginx terminates TLS and HTTP/2 on 8443, serves /static/*
# from disk, and forwards everything else to viltrum over HTTP/1.1.
worker_processes 32;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   off;
    sendfile     on;
    tcp_nopush   on;
    tcp_nodelay  on;
    keepalive_timeout  300s;
    keepalive_requests 1000000;
    server_tokens off;

    gzip_static on;
    gzip_vary   on;

    upstream viltrum {
        server 127.0.0.1:8085;
        keepalive 2048;
        keepalive_requests 1000000;
        keepalive_timeout 300s;
    }

    # 127.0.0.1, not a wildcard: the standalone entry also binds 0.0.0.0:8443
    # with SO_REUSEPORT during validation, and a wildcard listen would share
    # connections with it. The harness dials localhost.
    server {
        listen 127.0.0.1:8443 ssl reuseport backlog=65535;
        listen [::1]:8443 ssl reuseport backlog=65535;
        http2 on;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location /static/ {
            alias /data/static/;
        }

        location / {
            proxy_pass http://viltrum;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }
    }
}
